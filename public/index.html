<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lernin</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#F3F8F4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F1810" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
  <script>
    // Inline script to set theme before paint — prevents flash of wrong theme
    (function() {
      try {
        const saved = localStorage.getItem('lernin-theme');
        if (saved && saved !== 'system') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <script defer src="/vendor/katex/katex.min.js"></script>
  <script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script type="module" src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
