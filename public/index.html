<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lernin</title>
  <script>
    // Synchronous boot cache read: IndexedDB `settings.theme` is canonical, but localStorage
    // `lernin-theme` is read here strictly before first paint to prevent Flash of Unstyled Content (FOUC).
    (function() {
      try {
        const saved = localStorage.getItem('lernin-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
      try {
        // Calm (reduced motion): the Settings switch is cached here, and the OS setting is honoured
        // automatically, so data-calm is on <html> before first paint. motion-pref.js keeps it current.
        var calm = localStorage.getItem('lernin-calm') === '1' ||
          !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        document.documentElement.setAttribute('data-calm', calm ? '1' : '0');
      } catch (e) {}
      try {
        var font = localStorage.getItem('lernin_font') || 'default';
        var FONT_STACKS = {
          'default': "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
          'serif': "Georgia, 'Times New Roman', serif",
          'mono': "'SF Mono', 'Courier New', monospace",
          'clean': "'Helvetica Neue', Arial, sans-serif"
        };
        document.documentElement.style.setProperty('--font-body', FONT_STACKS[font] || FONT_STACKS['default']);
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#F3F8F4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F1810" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/stage.css" />
  <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
</head>
<body>
  <!-- The stage: a decorative living backdrop. A sibling BEFORE #root (screens replace root.innerHTML). -->
  <div id="stage" aria-hidden="true"></div>
  <div id="root"></div>

  <script defer src="/vendor/katex/katex.min.js"></script>
  <script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
